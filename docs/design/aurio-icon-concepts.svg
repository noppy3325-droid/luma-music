<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 180" width="416" height="180">
  <title>Aurio icon concepts</title>
  <desc>Three alternatives at 72 and 24 pixels, with circular and rounded launcher masks.</desc>
  <defs>
    <radialGradient id="background" gradientUnits="userSpaceOnUse" cx="40" cy="20" r="85">
      <stop offset="0" stop-color="#AA455B"/>
      <stop offset=".55" stop-color="#632C47"/>
      <stop offset="1" stop-color="#281C33"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="54" cy="54" r="36"/></clipPath>
    <clipPath id="round"><rect x="18" y="18" width="72" height="72" rx="20"/></clipPath>
    <g id="wave" fill="none" stroke="#FFF3E6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path fill="url(#background)" stroke="none" d="M0,0H108V108H0Z"/>
      <path d="M34,74 L49,36 C51,31 57,31 59,36 L74,74 M39,61 H45 C49,61 50,65 54,65 C60,65 60,53 67,53 H71"/>
    </g>
    <g id="resonance" fill="none" stroke="#FFF3E6" stroke-width="8" stroke-linecap="round">
      <path fill="url(#background)" stroke="none" d="M0,0H108V108H0Z"/>
      <path d="M34,44 C26,50 26,58 34,64 M44,36 C29,47 29,61 44,72 M64,36 C79,47 79,61 64,72 M74,44 C82,50 82,58 74,64"/>
      <circle cx="54" cy="54" r="5" fill="#FFF3E6" stroke="none"/>
    </g>
    <g id="pulse" fill="none" stroke="#FFF3E6" stroke-width="8" stroke-linecap="round">
      <path fill="url(#background)" stroke="none" d="M0,0H108V108H0Z"/>
      <path d="M33,50V58 M47,42V66 M61,33V75 M75,45V63"/>
    </g>
  </defs>
  <rect width="416" height="180" rx="12" fill="#FBF5F3"/>
  <g transform="translate(22 2)">
    <use href="#wave" clip-path="url(#circle)"/>
    <use href="#wave" transform="translate(36 104) scale(.333333)" clip-path="url(#round)"/>
  </g>
  <g transform="translate(154 2)">
    <use href="#resonance" clip-path="url(#circle)"/>
    <use href="#resonance" transform="translate(36 104) scale(.333333)" clip-path="url(#round)"/>
  </g>
  <g transform="translate(286 2)">
    <use href="#pulse" clip-path="url(#circle)"/>
    <use href="#pulse" transform="translate(36 104) scale(.333333)" clip-path="url(#round)"/>
  </g>
  <g text-anchor="middle" fill="#281C33" font-family="sans-serif" font-size="12">
    <text x="76" y="158" font-weight="700">Wave A</text>
    <text x="208" y="158">Resonance</text>
    <text x="340" y="158">Pulse</text>
  </g>
</svg>
